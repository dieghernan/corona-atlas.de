remote_theme: dieghernan/chulapa
repository: dieghernan/corona-atlas.de
url: https://dieghernan.github.io
baseurl: "/corona-atlas.de"

# Find errors on this file with http://www.yamllint.com/

# Chulapa docs: https://dieghernan.github.io/chulapa/docs/02-config

# A. Site Settings /SEO options
# Overall options for your site, would affect your site SEO
# Default values are explained
locale                  : de-DE
title                   : "Corona Atlas"
subtitle                : "Historisches Archiv internationaler COVID-19-Risikogebiete"
description             : "Historisches Archiv der von deutschen Behörden ausgewiesenen internationalen COVID-19-Risikogebiete. Das Projekt ist eingestellt und wird nicht aktualisiert."

timezone                :  Europe/Berlin

# SEO
og_image: https://dieghernan.github.io/corona-atlas.de/assets/img/social-preview.jpg
og_image_alt: "Corona Atlas: historisches Archiv internationaler COVID-19-Risikogebiete, mit einer historischen Karte. Projekt eingestellt."
og_image_width: 1200
og_image_height: 630
og_image_type: image/jpeg
twitter_site            : rodrihgh
author:
  name                  :  "Diego & Rodrigo"
  location              :  "Berlin, Germany"

gtag_id                 : "G-N81B7N0WSC"


# B. Navigation
navbar:
  style: dual
  brand:
    title   :  Corona Atlas # Title in navbar
    url     :  # default["url/baseurl"]
    img     : /assets/img/corona-atlas-icon.svg
  nav:
  - title: Language
    img: /assets/img/globe.svg
    child:
    - title   : Deutsch <img class="d-inline mb-1" src="https://flagcdn.com/16x12/de.png" width="16" height="12" alt="Germany">
      url     : /
    - title   : English <img class="d-inline mb-1" src="https://flagcdn.com/16x12/gb.png" width="16" height="12" alt="United Kingdom">
      url     : /en # url
    - title   : Español <img class="d-inline mb-1" src="https://flagcdn.com/16x12/es.png" width="16" height="12" alt="Spain"> # Label
      url     : /es # url
    - title: Français <img class="d-inline mb-1" src="https://flagcdn.com/16x12/fr.png" width="16" height="12" alt="France">
      url: /fr
    - title: Polski <img class="d-inline mb-1" src="https://flagcdn.com/16x12/pl.png" width="16" height="12" alt="Poland">
      url: /pl
    - title: Türkçe <img class="d-inline mb-1" src="https://flagcdn.com/16x12/tr.png" width="16" height="12" alt="Turkey">
      url: /tr
  - title   : About # Label
    url     : /about # url
  - title: '<i class="fab fa-github mr-1" aria-hidden="true"></i> GitHub'
    url: https://github.com/dieghernan/corona-atlas.de

footer:
  links:
    - label: "E-Mail"
      icon: "fas fa-envelope"
      url:  "mailto:info@corona-atlas.de"
    - label: "GitHub"
      icon: "fab fa-github"
      url:  "https://github.com/dieghernan/corona-atlas.de"

# C. Theme Settings

chulapa-skin:
  skin          : academia

# D. Jekyll Defaults and collections: see https://jekyllrb.com/
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      header_type: "base"
      include_on_search   : false
      show_sociallinks  : true
      leaflet: true
      show_comments: false


# XX. Other settings - no need to modify
# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  blanklines: true

plugins:
  - jekyll-remote-theme
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-sitemap


# Exclude these files from production site
exclude:
  - LICENSE
  - scripts
  - AGENTS.md
  - Gemfile.lock
  - .bundle
  - log
  - timelapse
  - README.md
  - Gemfile
  - vendor
  - _R
  - '*.Rmd'
  - scrap
  - requirements.txt
  - scrapy.cfg
  - renv
  - renv.lock
  - '*.Rproj'

include:
 - _pages

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  footnote_backlink: '&uarr;'
  entity_output: as_char
  toc_levels: 2..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
    - abs-percent
    - function-units
    - if-function

